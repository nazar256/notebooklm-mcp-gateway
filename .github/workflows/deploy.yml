name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker-main
  cancel-in-progress: false

jobs:
  check:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: check
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve KV namespace id
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ns_title="notebooklm-mcp-session-kv"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          ns_id="$(curl -sf "$api?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r --arg t "$ns_title" '.result[]? | select(.title == $t) | .id' | head -n1)"
          if [ -z "$ns_id" ] || [ "$ns_id" = "null" ]; then
            echo "KV namespace '$ns_title' not found; creating it."
            ns_id="$(curl -sf -X POST "$api" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"$ns_title\"}" | jq -r '.result.id')"
          fi
          if [ -z "$ns_id" ] || [ "$ns_id" = "null" ]; then
            echo "Failed to resolve KV namespace id (check CLOUDFLARE_API_TOKEN has Workers KV Storage edit permission)." >&2
            exit 1
          fi
          echo "Using KV namespace $ns_title ($ns_id)"
          sed -i "s/__NOTEBOOKLM_SESSION_KV_ID__/$ns_id/" wrangler.jsonc

      - name: Bootstrap Worker and initialize missing Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          secret_list_stderr="$(mktemp)"

          if existing_secret_names="$(npx wrangler secret list --format json 2>"$secret_list_stderr" | jq -r '.[].name')"; then
            rm -f "$secret_list_stderr"
          elif grep -Fq 'Worker "' "$secret_list_stderr" && grep -Fq 'not found' "$secret_list_stderr"; then
            rm -f "$secret_list_stderr"
            echo "Worker does not exist yet. Running bootstrap deploy before secret initialization."

            npx wrangler deploy

            if ! existing_secret_names="$(npx wrangler secret list --format json | jq -r '.[].name')"; then
              echo "Failed to list existing Worker secrets after bootstrap deploy." >&2
              exit 1
            fi
          else
            echo "Failed to list existing Worker secrets before deploy." >&2
            cat "$secret_list_stderr" >&2
            rm -f "$secret_list_stderr"
            exit 1
          fi

          required_secrets=(
            OAUTH_JWT_SIGNING_KEY_B64
            NOTEBOOKLM_CREDENTIAL_ENC_KEY_B64
            CSRF_SIGNING_KEY_B64
          )

          for secret_name in "${required_secrets[@]}"; do
            if grep -Fxq "$secret_name" <<<"$existing_secret_names"; then
              echo "Worker secret already initialized: $secret_name"
              continue
            fi

            echo "Initializing missing Worker secret: $secret_name"
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put "$secret_name"
          done

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
